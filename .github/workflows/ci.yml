name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend (pytest with real sandbox images)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # The analysis/execution tests run the real toolchains inside the project's
      # own images (see docs/LOCAL_RUN_GUIDE.md). Build them exactly as a user would.
      - name: Build sandbox images
        run: |
          docker build -t compilevista/analyzer:m2 sandbox/analyzer
          docker build -t compilevista/runtime:m4 sandbox/runtime
          docker build -t compilevista/debug:m5 sandbox/debug
      - name: Run backend tests
        run: python -m pytest backend/tests -q -p no:cacheprovider
